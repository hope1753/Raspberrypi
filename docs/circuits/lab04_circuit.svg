<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1175" viewBox="0 0 1000 1175" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
<rect width="1000" height="1175" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1f2937">실습 4 회로 구성 - 센서 통합 웹 서버</text>
